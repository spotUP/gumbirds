# ADPCM-A sound effects. Placeholders generated by tools/make_sfx_placeholders.py into build/sound/sfx.
# channel is 1-based (1-6): soundtool plays on ADPCM-A hardware channel (channel - 1). Music uses FM/SSG only.
---
- adpcm_a:
    channel: 5
    name: jump
    uri: file://build/sound/sfx/jump.wav
- adpcm_a:
    channel: 4
    name: hit
    uri: file://build/sound/sfx/hit.wav
- adpcm_a:
    channel: 2
    name: game_over
    uri: file://build/sound/sfx/game_over.wav
- adpcm_a:
    channel: 1
    name: coin
    uri: file://build/sound/sfx/coin.wav
- adpcm_a:
    channel: 3
    name: die
    uri: file://build/sound/sfx/die.wav
- adpcm_a:
    channel: 6
    name: fall
    uri: file://build/sound/sfx/fall.wav
- adpcm_a:
    channel: 1
    name: splosh
    uri: file://build/sound/sfx/splosh.wav
- adpcm_a:
    channel: 1
    name: spike
    uri: file://build/sound/sfx/spike.wav
- adpcm_a:
    channel: 1
    name: sizzle
    uri: file://build/sound/sfx/sizzle.wav
- adpcm_a:
    channel: 2
    name: pop
    uri: file://build/sound/sfx/pop.wav
