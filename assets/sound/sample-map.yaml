# ADPCM-A sound effects, rendered by tools/make_sfx.py into build/sound/sfx (own synthesis, nothing sampled).
# channel is 1-based (1-6): soundtool plays on ADPCM-A hardware channel (channel - 1). Music uses FM/SSG only.
# The driver has no priority: the newest sample on a channel cuts the one playing. Channel plan:
#   1 environment   2 pops and bumps   3 flier fate (and the perfect jingle: nothing dies on the result screen)
#   4 hit and rival sounds   5 flaps   6 fall plus the interface sounds
# die (3) and fall (6) fire in consecutive frames, so they never share a channel.
---
- adpcm_a:
    channel: 1
    name: splosh
    uri: file://build/sound/sfx/splosh.wav
- adpcm_a:
    channel: 1
    name: spike
    uri: file://build/sound/sfx/spike.wav
